<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Barracuda Audio & Operations Test Suite</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0a0e14; color:#e0e8ec; font-family:'Segoe UI',sans-serif; padding:20px; }
    h1 { color:#00ff88; font-size:20px; margin-bottom:16px; }
    h2 { color:#00ccff; font-size:16px; margin:16px 0 8px; border-bottom:1px solid #1a2a3a; padding-bottom:4px; }
    .test-section { margin-bottom:24px; }
    .test-btn { display:inline-block; margin:3px; padding:6px 14px; background:#0a1a28; border:1px solid #1a3a4a; 
                color:#8da4af; cursor:pointer; border-radius:4px; font-size:12px; transition:all .2s; }
    .test-btn:hover { background:#1a3a4a; color:#fff; }
    .test-btn.pass { border-color:#00ff88; color:#00ff88; }
    .test-btn.fail { border-color:#ff3333; color:#ff3333; }
    .log-panel { background:#060a10; border:1px solid #1a2a3a; border-radius:6px; padding:10px; 
                 max-height:400px; overflow-y:auto; font-family:monospace; font-size:11px; margin-top:12px; }
    .log-pass { color:#00ff88; }
    .log-fail { color:#ff5555; }
    .log-info { color:#00ccff; }
    .summary { padding:12px; margin-top:16px; border-radius:8px; font-weight:700; font-size:16px; }
    .summary.pass { background:rgba(0,255,100,0.1); border:2px solid #00ff88; color:#00ff88; }
    .summary.fail { background:rgba(255,50,50,0.1); border:2px solid #ff3333; color:#ff3333; }
    #btn-run-all { padding:10px 24px; background:linear-gradient(135deg,#00aa44,#00ff88); border:none; 
                   border-radius:8px; color:#000; font-size:14px; font-weight:700; cursor:pointer; margin-bottom:16px; }
  </style>
</head>
<body>
  <h1>🧪 BARRACUDA TEST SUITE — Audio & Operations</h1>
  <button id="btn-run-all">▶ ЗАПУСТИТЬ ВСЕ ТЕСТЫ</button>
  
  <div class="test-section" id="audio-tests">
    <h2>🔊 АУДИО-МЕТОДЫ</h2>
    <div id="audio-buttons"></div>
  </div>

  <div class="test-section" id="campaign-tests">
    <h2>⚔️ КАМПАНИЯ И МИССИИ</h2>
    <div id="campaign-results"></div>
  </div>

  <div class="test-section" id="env-tests">
    <h2>🌊 СРЕДА (ДНЕПР)</h2>
    <div id="env-results"></div>
  </div>

  <div class="log-panel" id="log-panel"></div>
  <div class="summary" id="summary" style="display:none;"></div>

  <script src="audio.js"></script>
  <script>
    // =================================================================
    // TEST INFRASTRUCTURE
    // =================================================================
    const logPanel = document.getElementById('log-panel');
    let totalTests = 0, passedTests = 0, failedTests = 0;

    function log(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = `log-${type}`;
      el.textContent = `[${new Date().toISOString().slice(11,19)}] ${msg}`;
      logPanel.appendChild(el);
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    function assert(condition, testName) {
      totalTests++;
      if (condition) {
        passedTests++;
        log(`✅ PASS: ${testName}`, 'pass');
        return true;
      } else {
        failedTests++;
        log(`❌ FAIL: ${testName}`, 'fail');
        return false;
      }
    }

    function showSummary() {
      const el = document.getElementById('summary');
      el.style.display = 'block';
      if (failedTests === 0) {
        el.className = 'summary pass';
        el.textContent = `✅ ВСЕ ТЕСТЫ ПРОЙДЕНЫ: ${passedTests}/${totalTests}`;
      } else {
        el.className = 'summary fail';
        el.textContent = `❌ ПРОВАЛЕНО ${failedTests} из ${totalTests} тестов`;
      }
    }

    // =================================================================
    // TEST 1: ALL AUDIO METHODS EXIST
    // =================================================================
    const requiredAudioMethods = [
      'init', 'playPing', 'playCritPing', 'playMountingSfx', 'playUpgradeSfx',
      'playContractSfx', 'playTypewriter', 'playThermalModeSfx', 'playMissileLaunch',
      'playRadioSquelch', 'playCyberHackTone', 'playSonarPing', 'playAlarm',
      'playExplosion', 'playHeavyExplosion', 'playEmpExplosion', 'playEnemyShoot',
      'playTargetLock', 'playPVOFlyby', 'playRWR', 'playCountermeasure',
      'playFPVLaunch', 'playPerfectLaunch', 'playShieldHit', 'playDataPickup',
      'playLockOnTone', 'playPhaseTransition', 'playRatingReveal',
      'playAchievementUnlock', 'playEventAlert', 'playThunderCrack',
      'playCyberInterference', 'playShockwave', 'startAmbient', 'stopAmbient',
      'playCommsChirp', 'playTeletypeChar', 'playRadioStatic', 'playSalvagePickup',
      'playMissionVictory', 'playAlertAlarm', 'startFpvMotorSound',
      'updateFpvMotorSound', 'stopFpvMotorSound', 'playCiwsBurst',
      'playGlitchStatic', 'playReconScan', 'playTargetFound', 'playPhotoCaptured',
      'playWaterSplash', 'playHullImpact', 'playRewScanPulse', 'playRewSuccess', 'playRewFail',
      'playShallowWaterAlarm', 'playVsaToggle', 'playWaterDrift', 'playRovThruster', 'playSiphonLock', 'playAiLockEngaged'
    ];

    function testAudioMethods() {
      log('=== ТЕСТ АУДИО-МЕТОДОВ ===', 'info');
      const audio = window.tacticalAudio;
      
      assert(audio !== undefined && audio !== null, 'TacticalAudioEngine существует');
      assert(audio instanceof TacticalAudioEngine, 'Является инстансом TacticalAudioEngine');

      const buttonsEl = document.getElementById('audio-buttons');
      buttonsEl.innerHTML = '';

      requiredAudioMethods.forEach(method => {
        const exists = typeof audio[method] === 'function';
        assert(exists, `Метод audio.${method}() существует`);

        // Create play button for manual testing
        const btn = document.createElement('button');
        btn.className = `test-btn ${exists ? 'pass' : 'fail'}`;
        btn.textContent = method;
        if (exists) {
          btn.addEventListener('click', () => {
            try {
              if (method === 'startAmbient') audio[method]('sector-1');
              else if (method === 'playCyberHackTone') audio[method](true);
              else if (method === 'playRatingReveal') audio[method]('S');
              else if (method === 'playRadioStatic') audio[method](0.2);
              else if (method === 'playLockOnTone') audio[method](true);
              else if (method === 'updateFpvMotorSound') audio[method](0.7, false);
              else audio[method]();
              log(`▶ Воспроизведён: ${method}()`, 'info');
              btn.style.background = '#003322';
            } catch (e) {
              log(`⚠ Ошибка при воспроизведении ${method}(): ${e.message}`, 'fail');
              btn.style.background = '#330000';
            }
          });
        }
        buttonsEl.appendChild(btn);
      });
    }

    // =================================================================
    // TEST 2: AUDIO PLAYS WITHOUT ERRORS
    // =================================================================
    function testAudioPlayback() {
      log('=== ТЕСТ ВОСПРОИЗВЕДЕНИЯ АУДИО ===', 'info');
      const audio = window.tacticalAudio;
      audio.init();

      assert(audio.ctx !== null, 'AudioContext создан');
      assert(audio.ctx.state !== 'closed', 'AudioContext не закрыт');
      assert(audio.masterGain !== null, 'Master gain node создан');
      assert(audio.compressor !== null, 'Compressor создан');

      // Test each critical sound doesn't throw
      const safeMethods = [
        'playPing', 'playCritPing', 'playExplosion', 'playMissileLaunch',
        'playHeavyExplosion', 'playEnemyShoot', 'playTargetLock', 'playEmpExplosion',
        'playUpgradeSfx', 'playAlarm', 'playFPVLaunch', 'playShockwave',
        'playReconScan', 'playTargetFound', 'playPhotoCaptured',
        'playWaterSplash', 'playHullImpact'
      ];

      safeMethods.forEach(m => {
        try {
          audio[m]();
          assert(true, `${m}() воспроизводится без ошибок`);
        } catch (e) {
          assert(false, `${m}() бросает ошибку: ${e.message}`);
        }
      });

      // Test FPV motor lifecycle
      try {
        audio.startFpvMotorSound();
        audio.updateFpvMotorSound(0.5, false);
        audio.updateFpvMotorSound(0.9, true);
        audio.stopFpvMotorSound();
        assert(true, 'FPV motor lifecycle (start→update→stop) работает');
      } catch (e) {
        assert(false, `FPV motor lifecycle ошибка: ${e.message}`);
      }

      // Test ambient lifecycle
      try {
        audio.startAmbient('sector-1');
        assert(audio.isAmbientPlaying, 'Ambient запущен');
        audio.stopAmbient();
        assert(!audio.isAmbientPlaying, 'Ambient остановлен');
        assert(true, 'Ambient lifecycle работает');
      } catch (e) {
        assert(false, `Ambient lifecycle ошибка: ${e.message}`);
      }
    }

    // =================================================================
    // TEST 3: CAMPAIGN STRUCTURE VALIDATION
    // =================================================================
    function testCampaignStructure() {
      log('=== ТЕСТ СТРУКТУРЫ КАМПАНИИ ===', 'info');
      
      // Load game.js definitions — we can't import them directly, so we validate structure
      // by loading game.js and checking global vars
      const script = document.createElement('script');
      script.src = 'game.js';
      script.onload = () => {
        try {
          // Check CAMPAIGN_ACTS_DEF exists
          assert(typeof CAMPAIGN_ACTS_DEF !== 'undefined', 'CAMPAIGN_ACTS_DEF определён');
          assert(Array.isArray(CAMPAIGN_ACTS_DEF), 'CAMPAIGN_ACTS_DEF — массив');
          assert(CAMPAIGN_ACTS_DEF.length === 4, `4 акта (нашёл ${CAMPAIGN_ACTS_DEF.length})`);

          let missionCount = 0;
          let reconCount = 0;
          let rewCount = 0;
          let strikeCount = 0;

          CAMPAIGN_ACTS_DEF.forEach((act, aIdx) => {
            assert(act.act === aIdx + 1, `Акт ${aIdx + 1} имеет правильный номер`);
            assert(act.title && act.title.length > 0, `Акт ${aIdx + 1} имеет заголовок`);
            assert(act.sector && act.sector.startsWith('sector-'), `Акт ${aIdx + 1} привязан к сектору`);
            assert(Array.isArray(act.missions), `Акт ${aIdx + 1} имеет массив миссий`);
            assert(act.missions.length === 3, `Акт ${aIdx + 1} имеет 3 миссии (нашёл ${act.missions.length})`);

            act.missions.forEach((m, mIdx) => {
              missionCount++;
              const mType = m.missionType || 'strike';
              if (mType === 'recon') reconCount++;
              else if (mType === 'rew') rewCount++;
              else strikeCount++;

              assert(m.id && m.id.length > 0, `Миссия ${m.id} имеет ID`);
              assert(m.title && m.title.length > 0, `Миссия ${m.id} имеет заголовок`);
              assert(m.desc && m.desc.length > 0, `Миссия ${m.id} имеет описание`);
              assert(m.reward && typeof m.reward.usd === 'number', `Миссия ${m.id} имеет награду USD`);
              assert(m.reward && typeof m.reward.mb === 'number', `Миссия ${m.id} имеет награду МБ`);
              assert(Array.isArray(m.phases), `Миссия ${m.id} имеет массив фаз`);
              assert(m.phases.length >= 3, `Миссия ${m.id} имеет ≥3 фазы (${m.phases.length})`);

              // Validate mission type specific fields
              if (mType === 'recon') {
                assert(typeof m.reconTargets === 'number' && m.reconTargets > 0, `Recon ${m.id}: reconTargets > 0`);
                assert(typeof m.reconTimeLimit === 'number' && m.reconTimeLimit > 0, `Recon ${m.id}: reconTimeLimit > 0`);
              }
              if (mType === 'rew') {
                assert(typeof m.rewChannels === 'number' && m.rewChannels > 0, `REW ${m.id}: rewChannels > 0`);
                assert(typeof m.rewTimePerChannel === 'number', `REW ${m.id}: rewTimePerChannel определён`);
              }

              // Validate enemies
              assert(Array.isArray(m.enemies) && m.enemies.length > 0, `Миссия ${m.id} имеет список врагов`);
              if (m.enemies) {
                m.enemies.forEach(e => {
                  assert(e.type && e.type.length > 0, `Враг в ${m.id} имеет тип: ${e.type}`);
                  assert(e.name && e.name.length > 0, `Враг в ${m.id} имеет имя: ${e.name}`);
                  assert(typeof e.count === 'number' && e.count > 0, `Враг ${e.name} count > 0`);
                });
              }

              // Validate comms intro
              assert(m.commsIntro && m.commsIntro.speaker, `Миссия ${m.id} имеет комм-вступление`);
            });
          });

          log(`Всего миссий: ${missionCount} (${reconCount} разведка, ${rewCount} РЭБ, ${strikeCount} ударных)`, 'info');
          assert(reconCount >= 4, `Не менее 4 разведывательных миссий (нашёл ${reconCount})`);
          assert(rewCount >= 2, `Не менее 2 РЭБ-миссий (нашёл ${rewCount})`);
          assert(strikeCount >= 4, `Не менее 4 ударных миссий (нашёл ${strikeCount})`);

          // Check SECTOR_INFO
          assert(typeof SECTOR_INFO !== 'undefined', 'SECTOR_INFO определён');
          const sectorNames = Object.values(SECTOR_INFO).map(s => s.name);
          assert(sectorNames.some(n => n.includes('АНТОНОВСКИЙ')), 'Сектор 1 — Антоновский мост');
          assert(sectorNames.some(n => n.includes('КАХОВСКАЯ')), 'Сектор 2 — Каховская ГЭС');
          assert(sectorNames.some(n => n.includes('ХЕРСОНСКИЙ')), 'Сектор 3 — Херсонский порт');
          assert(sectorNames.some(n => n.includes('ДЕЛЬТА')), 'Сектор 4 — Дельта Днепра');

          // Check enemy diversity
          const allEnemyTypes = new Set();
          CAMPAIGN_ACTS_DEF.forEach(a => a.missions.forEach(m => {
            if (m.enemies) m.enemies.forEach(e => allEnemyTypes.add(e.type));
          }));
          log(`Уникальных типов врагов: ${allEnemyTypes.size} (${[...allEnemyTypes].join(', ')})`, 'info');
          assert(allEnemyTypes.size >= 6, `Не менее 6 уникальных типов врагов (нашёл ${allEnemyTypes.size})`);

          const results = document.getElementById('campaign-results');
          results.innerHTML = `<div style="color:#00ff88;font-size:13px;">✅ ${missionCount} миссий, ${reconCount} разведка, ${rewCount} РЭБ, ${strikeCount} ударных.<br>Типов врагов: ${allEnemyTypes.size} (${[...allEnemyTypes].join(', ')})</div>`;

        } catch (e) {
          assert(false, `Ошибка загрузки game.js: ${e.message}`);
        }

        showSummary();
      };

      script.onerror = () => {
        assert(false, 'game.js не удалось загрузить');
        showSummary();
      };

      document.body.appendChild(script);
    }

    // =================================================================
    // RUN ALL
    // =================================================================
    document.getElementById('btn-run-all').addEventListener('click', () => {
      totalTests = 0; passedTests = 0; failedTests = 0;
      logPanel.innerHTML = '';
      document.getElementById('summary').style.display = 'none';

      log('🧪 ЗАПУСК ПОЛНОГО ТЕСТИРОВАНИЯ', 'info');
      log('', 'info');

      testAudioMethods();
      testAudioPlayback();
      
      // Campaign tests load game.js async, so summary is shown after
      testCampaignStructure();
    });
  </script>
</body>
</html>
